[project]
name = "yandex-direct"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "aiohttp>=3.13.5",
    "aiosqlite>=0.22.1",
    "loguru>=0.7.3",
    "pydantic>=2.4.1,<2.11",
    "pydantic-settings>=2.13.1",
    "pytelegrambotapi>=4.33.0",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
]

[tool.ruff]
line-length = 79
indent-width = 4
required-version = ">=0.11.11"
target-version = "py312"
preview = true
exclude = ["alembic", "garbage"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
# Вот здесь мы прописываем все игноры
ignore = [
    "E265", "F811", "D100", "D105", "D104", "D203", "D211", "D213",
    "N818", "W505", "ANN401", "COM812", "ANN204", "D107"
]
select = ["E3", "E5", "E4", "E7", "E9", "W", "C90", "I", "N", "D", "F", "ANN", "ASYNC", "A", "COM", "RET"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "E401"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
case-sensitive = true
known-local-folder = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pycodestyle]
max-doc-length = 79
max-line-length = 79
