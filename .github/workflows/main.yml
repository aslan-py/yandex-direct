name: CI/CD Pipeline yandex-direct

on:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код на виртуальную машину.
        uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Установка python
        run: uv python install 3.12

      - name: Установить зависимости
        run: |
          uv sync --all-extras --dev

      - name: Запустить проверку Ruff
        run: uvx ruff check .

      - name: Запустить pre-commit
        run: uvx pre-commit run --all-files
  
  deploy: 
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Собрать и отправить образ в Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/yandex-checker:latest

      - name: Подключиться к серверу и обновить контейнер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /root/projects/
            docker compose pull yandex_direct_bot
            docker compose up -d yandex_direct_bot
            docker image prune -af
  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Отправить сообщение в ТГ
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: Деплой yandex-direct выполенен!
